name: Release

# Builds the Windows installer from the source in this repository and attaches it, together with
# the Linux / macOS installer, to a release. Nobody uploads a hand-made .exe.
#
# Two ways to start it:
#   - upload a version tag (git tag v1.0.0 && git push origin v1.0.0), or
#   - on the website: Actions > Release > "Run workflow", and type the version (v1.0.0).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest draws
        # The draw history is built into the program; a failure here just keeps the copy in the repository.
        continue-on-error: true
        run: node tools/update-data.mjs
      - name: Build
        shell: cmd
        run: call build.bat
      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item bin\EuroWatcher.exe EuroWatcher-portable.exe
          Get-FileHash EuroWatcherSetup.exe, EuroWatcher-portable.exe, install.sh -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          $tag = $env:VERSION
          if ($tag -notmatch '^v\d+\.\d+(\.\d+)?$') { throw "'$tag' does not look like a version (expected something like v1.0.0)" }
          $notes = @"
          **Windows 10 / 11:** download ``EuroWatcherSetup.exe`` and run it. It installs for your account only (no administrator
          permission). Windows will warn that the publisher is unknown, because the program is not code-signed: choose
          *More info* > *Run anyway*, or build it yourself with ``build.bat``. ``EuroWatcher-portable.exe`` is the program without the installer.

          **Linux / macOS:** ``curl -fsSL https://raw.githubusercontent.com/Mohenni/EuroWatcher/main/install.sh | sh``

          These files were built by GitHub from the source code of this version. ``SHA256SUMS.txt`` lists their checksums.
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "EuroWatcher $tag" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "could not create the release" }
          }
          gh release upload $tag EuroWatcherSetup.exe EuroWatcher-portable.exe install.sh SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not attach the files" }
