name: Website

# Publishes the EuroWatcher page as a website on GitHub Pages: https://mohenni.github.io/EuroWatcher/
# It runs on every upload of the page, and right after "Update draw data" has fetched new draws,
# so the site is current the morning after every Tuesday and Friday draw.
# (Uploads made by GitHub's own jobs do not start other jobs, hence the second trigger.)
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['index.html', 'styles.css', 'app.js', 'i18n.js', 'data/**', 'CNAME', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Update draw data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect the files of the site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js i18n.js _site/
          cp data/draws.js _site/data/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          ls -la _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
